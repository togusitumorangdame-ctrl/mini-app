<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader Pro - VIP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #1e1e1e; width: 100%; max-width: 400px; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        h2 { margin-bottom: 15px; color: #ff4757; font-size: 1.4rem; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: #ccc; }
        input[type="text"], select { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #333; background-color: #2a2a2a; color: #fff; font-size: 0.9rem; outline: none; }
        input[type="text"]:focus, select:focus { border-color: #ff4757; }
        button { width: 100%; padding: 12px; background-color: #ff4757; color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        button:active { transform: scale(0.98); background-color: #e04040; }
        #status { margin-top: 15px; font-size: 0.85rem; min-height: 20px; }
        .pricing-info { margin-top: 20px; padding: 12px; background-color: #2a2a2a; border-radius: 8px; font-size: 0.8rem; color: #aaa; text-align: left; }
        .pricing-info span { color: #2ed573; font-weight: bold; }
        
        /* Tombol WhatsApp */
        .wa-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            transition: 0.2s;
        }
        .wa-btn:active {
            background-color: #1ebe57;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Downloader VIP</h2>

        <div class="input-group">
            <label for="token">Token / No HP Langganan:</label>
            <input type="text" id="token" placeholder="Masukkan token Anda..." autocomplete="off">
        </div>

        <div class="input-group">
            <label for="videoUrl">Tautan Video YouTube:</label>
            <input type="text" id="videoUrl" placeholder="https://youtu.be/..." autocomplete="off">
        </div>

        <div class="input-group">
            <label for="format">Format Output:</label>
            <select id="format">
                <option value="mp4">MP4 (Video)</option>
                <option value="mp3">MP3 (Audio)</option>
            </select>
        </div>

        <button onclick="prosesUnduh()">UNDUH VIP</button>

        <div id="status"></div>

        <div class="pricing-info">
            Langganan Akses Sepuasnya: <span>Rp15.000 / Bulan</span><br>
            Belum punya token? Silakan beli akses dengan menghubungi admin.
            <a href="https://wa.me/6285230677520?text=Halo%20Admin,%20saya%20mau%20langganan%20aplikasi%20Media%20Downloader%20Pro%20VIP%20seharga%20Rp15.000/bulan.%20Mohon%20info%20pembayarannya." class="wa-btn" target="_blank">
                💬 Beli Token via WhatsApp
            </a>
        </div>
    </div>

    <script>
        function prosesUnduh() {
            const token = document.getElementById('token').value.trim();
            const url = document.getElementById('videoUrl').value.trim();
            const format = document.getElementById('format').value;
            const statusDiv = document.getElementById('status');

            if (!token) {
                statusDiv.style.color = '#ff4757';
                statusDiv.innerText = 'Harap masukkan Token Langganan!';
                return;
            }

            if (!url) {
                statusDiv.style.color = '#ff4757';
                statusDiv.innerText = 'Silakan isi link video YouTube!';
                return;
            }

            statusDiv.style.color = '#eccc68';
            statusDiv.innerText = 'Memverifikasi langganan & menyiapkan link...';

            // Alamat URL Cloudflare Tunnel yang terhubung langsung ke Termux
            fetch('https://amount-republic-computers-upgrading.trycloudflare.com/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, url: url, format: format })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    statusDiv.style.color = '#2ed573';
                    // Memunculkan tombol link download manual agar tidak diblokir browser
                    statusDiv.innerHTML = `Akses VIP Disetujui!<br><a href="${data.download_url}" target="_blank" style="display:inline-block; margin-top:8px; padding:10px 15px; background-color:#2ed573; color:#121212; font-weight:bold; text-decoration:none; border-radius:6px;">📥 Klik Disini Untuk Unduh Video</a>`;
                } else {
                    statusDiv.style.color = '#ff4757';
                    statusDiv.innerText = data.message;
                }
            })
            .catch(error => {
                statusDiv.style.color = '#ff4757';
                statusDiv.innerText = 'Error: Server Termux tidak aktif!';
            });
        }
    </script>
</body>
</html>
